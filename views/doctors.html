<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors & Professional Fees — Hospital Billing System</title>
</head>
<body>

    <p><a href="index.html">Back to Dashboard</a></p>

    <h2>Medical Doctors & Professional Fees Directory (Master File)</h2>
    <div>
        User: <strong id="user-display">Loading...</strong> | 
        <button id="btn-logout">Logout</button>
    </div>

    <hr>

    <!-- Add / Edit Doctor Form -->
    <div>
        <h3 id="form-title">Add New Doctor</h3>
        <input type="hidden" id="doctor_id" value="">

        <div>
            <label for="first_name">First Name: </label>
            <input type="text" id="first_name" placeholder="First Name" required>

            <label for="last_name">Last Name: </label>
            <input type="text" id="last_name" placeholder="Last Name" required>

            <label for="doctor_type_id">Classification: </label>
            <select id="doctor_type_id" required>
                <option value="">Select Classification...</option>
            </select>

            <label for="station_id">Department / Station: </label>
            <select id="station_id" required>
                <option value="">Select Department Station...</option>
            </select>
        </div>
        <br>
        <div>
            <label><strong>Medical Specialties (Select all that apply):</strong></label>
            <div id="specialties-checkboxes" style="margin-top: 5px; margin-bottom: 10px;">
                <!-- Checkboxes populated dynamically -->
            </div>
        </div>
        <div>
            <label for="base_round_fee">Base Bedside Round Fee (₱): </label>
            <input type="number" step="0.01" min="0" id="base_round_fee" placeholder="0.00" required>
        </div>
        <br>
        <div>
            <button id="btnSubmit">Submit Doctor</button>
            <button id="btnCancel" style="display:none;">Cancel</button>
        </div>
    </div>

    <hr>

    <h3>Doctors List</h3>

    <!-- Search, Filter, and Sort Controls (Pure HTML) -->
    <div style="margin-bottom: 12px;">
        <label for="search_input">Search: </label>
        <input type="text" id="search_input" placeholder="Search doctor name or code...">

        <label for="filter_status">Status: </label>
        <select id="filter_status">
            <option value="all">All Records</option>
            <option value="1">Active Only</option>
            <option value="0">Soft-Deleted Only</option>
        </select>

        <label for="filter_type">Classification: </label>
        <select id="filter_type">
            <option value="all">All Classifications</option>
        </select>

        <label for="filter_station">Station: </label>
        <select id="filter_station">
            <option value="all">All Stations</option>
        </select>

        <label for="filter_specialty">Specialty: </label>
        <select id="filter_specialty">
            <option value="all">All Specialties</option>
        </select>

        <label for="sort_by">Sort By: </label>
        <select id="sort_by">
            <option value="code_asc">Code (A to Z)</option>
            <option value="code_desc">Code (Z to A)</option>
            <option value="name_asc">Last Name (A to Z)</option>
            <option value="name_desc">Last Name (Z to A)</option>
            <option value="fee_asc">Round Fee (Lowest First)</option>
            <option value="fee_desc">Round Fee (Highest First)</option>
            <option value="id_desc">Newest First</option>
        </select>
    </div>

    <div id="table-div">
        <!-- Table generated dynamically by JavaScript -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/doctors.js"></script>
</body>
</html>
