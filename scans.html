<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment & Scans Catalog — Hospital Billing System</title>
</head>
<body>

    <p><a href="index.html">&laquo; Back to Dashboard</a></p>

    <h2>Equipment & Diagnostic Scans Catalog (Master File)</h2>
    <div>
        User: <strong id="user-display">Loading...</strong> | 
        <button id="btn-logout">Logout</button>
    </div>

    <hr>

    <!-- Add / Edit Form -->
    <div>
        <h3 id="form-title">Add New Scan / Diagnostic Procedure</h3>
        <input type="hidden" id="scan_id" value="">

        <div>
            <label for="scan_name">Scan Procedure Name: </label>
            <input type="text" id="scan_name" placeholder="e.g. Chest X-Ray PA View" size="35" required>

            &nbsp;&nbsp;
            <label for="station_id">Department: </label>
            <select id="station_id" required>
                <option value="">Select Department...</option>
            </select>
        </div>
        <br>
        <div>
            <label for="hospital_fee">Hospital / Machine Fee (₱): </label>
            <input type="number" step="0.01" min="0" id="hospital_fee" placeholder="0.00" required>

            &nbsp;&nbsp;
            <label for="reader_fee">Doctor Reader's Fee (₱): </label>
            <input type="number" step="0.01" min="0" id="reader_fee" placeholder="0.00" required>

            &nbsp;&nbsp;
            <strong>Total Billing Fee: <span id="total_fee_display">₱ 0.00</span></strong>
        </div>
        <br>
        <div>
            <button id="btnSubmit">Submit</button>
            <button id="btnCancel" style="display:none;">Cancel</button>
        </div>
    </div>

    <hr>

    <h3>Equipment & Scans List</h3>

    <!-- Search, Filter, and Sort Controls (Pure HTML) -->
    <div style="margin-bottom: 12px;">
        <label for="search_input">Search: </label>
        <input type="text" id="search_input" placeholder="Search by name or code...">

        &nbsp;&nbsp;
        <label for="filter_status">Status: </label>
        <select id="filter_status">
            <option value="all">All Records</option>
            <option value="1">Active Only</option>
            <option value="0">Soft-Deleted Only</option>
        </select>

        &nbsp;&nbsp;
        <label for="filter_station">Department: </label>
        <select id="filter_station">
            <option value="all">All Departments</option>
        </select>

        &nbsp;&nbsp;
        <label for="sort_by">Sort By: </label>
        <select id="sort_by">
            <option value="code_asc">Code (A to Z)</option>
            <option value="code_desc">Code (Z to A)</option>
            <option value="name_asc">Name (A to Z)</option>
            <option value="name_desc">Name (Z to A)</option>
            <option value="total_asc">Total Fee (Lowest First)</option>
            <option value="total_desc">Total Fee (Highest First)</option>
            <option value="id_desc">Newest First</option>
        </select>
    </div>

    <div id="table-div">
        <!-- Dynamic Table created by JavaScript -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="./js/scans.js"></script>
</body>
</html>
