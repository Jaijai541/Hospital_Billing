<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices & Settled Accounts — Hospital Billing System</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/invoices.css">
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar Navigation (Rendered from ../js/sidebar.js) -->
        <aside id="sidebar-container" class="sidebar"></aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <div class="topbar">
                <div class="topbar-title">
                    <h1>Settled Invoices & Billing Archive</h1>
                    <span class="subtitle">Finalized Statements of Account (SOA), Statutory Discounts & Cashier Settlements</span>
                </div>
            </div>

            <div class="content-body">
                <div class="card">
                    <div class="card-header">
                        <h2>Settled In-Patient Invoices Directory</h2>
                    </div>
                    <div class="card-body">
                        <div class="filter-bar">
                            <div class="form-group" style="min-width: 320px;">
                                <label class="form-label" for="search_input">Search Settled Invoices</label>
                                <input type="text" id="search_input" class="form-control" placeholder="Search patient name, invoice #, admission code or cashier...">
                            </div>

                            <div class="form-group" style="align-self: flex-end;">
                                <button id="btnRefresh" class="btn btn-primary">Refresh Invoices</button>
                            </div>
                        </div>

                        <div class="table-responsive" id="table-div">
                            <!-- Table generated dynamically by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/sidebar.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/invoices.js"></script>
</body>
</html>
