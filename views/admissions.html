<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>In-Patient Admissions — Hospital Billing System</title>
    <link rel="stylesheet" href="../css/common.css?v=18.8">
    <link rel="stylesheet" href="../css/admissions.css?v=18.3">
</head>
<body>

    <div class="app-wrapper">
        <aside id="sidebar-container" class="sidebar"></aside>
        <main class="main-content">
            <div class="page-header">
                <div class="page-title">
                    <h2>In-Patient Admissions & Bed Occupancy</h2>
                    <p>Clinical Admittance, Bed Allocation & Care Physician Team</p>
                </div>
                <button type="button" id="btnOpenAddModal" class="btn btn-primary">+ Admit New Patient</button>
            </div>
            <div id="formModal" class="modal-overlay">
                <div class="modal-container modal-lg">
                    <div class="modal-header">
                        <h3 id="form-title">Admit New In-Patient</h3>
                        <button type="button" class="modal-close" id="btnCloseModal" aria-label="Close modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-grid">
                            <div class="form-group span-2">
                                <label class="form-label" for="patient_id">Select Registered Patient * <span class="info-tip" tabindex="0" data-tooltip="Select patient to admit. Patients currently admitted in a bed cannot be re-admitted until discharged." aria-label="Patient selection info">i</span></label>
                                <div class="input-lookup-group">
                                    <input type="hidden" id="patient_id" required>
                                    <input type="text" id="patient_id_text" class="form-control" placeholder="Click to select registered patient..." readonly>
                                    <button type="button" id="btnBrowse_patient_id" class="btn btn-outline btn-lookup">Select</button>
                                </div>
                            </div>

                            <div class="form-group span-2">
                                <label class="form-label" for="bed_id">Assign Vacant Bed * <span class="info-tip" tabindex="0" data-tooltip="Shows bed code, room name, type, and daily board & lodging rate." aria-label="Bed assignment info">i</span></label>
                                <div class="input-lookup-group">
                                    <input type="hidden" id="bed_id" required>
                                    <input type="text" id="bed_id_text" class="form-control" placeholder="Click to select vacant room / bed..." readonly>
                                    <button type="button" id="btnBrowse_bed_id" class="btn btn-outline btn-lookup">Select</button>
                                </div>
                            </div>

                            <div class="form-group span-2">
                                <label class="form-label" for="chief_complaint">Chief Complaint * <span class="info-tip" tabindex="0" data-tooltip="Recorded upon initial patient triage and admittance." aria-label="Chief complaint info">i</span></label>
                                <textarea id="chief_complaint" class="form-control" rows="2" placeholder="Patient's primary symptoms, complaints, and reason for admission..." required></textarea>
                            </div>

                            <div class="form-group span-2">
                                <label class="form-label" for="diagnosis">Initial / Admitting Diagnosis (Optional) <span class="info-tip" tabindex="0" data-tooltip="Can be left blank on admission and evaluated by physicians during rounds/examinations." aria-label="Diagnosis info">i</span></label>
                                <textarea id="diagnosis" class="form-control" rows="2" placeholder="Physician's initial medical diagnosis (can be recorded or updated later during clinical care)..."></textarea>
                            </div>

                            <div class="form-group span-2">
                                <label class="form-label" for="selected_doctors_text">Assign Attending Physician(s) * <span class="info-tip" tabindex="0" data-tooltip="Select one or more attending or resident physicians responsible for this patient." aria-label="Physician assignment info">i</span></label>
                                <div class="input-lookup-group">
                                    <input type="text" id="selected_doctors_text" class="form-control" placeholder="Click to select physician(s)..." readonly>
                                    <button type="button" id="btnBrowseDoctors" class="btn btn-outline btn-lookup">Select</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="btnCancel">Cancel</button>
                        <button type="button" id="btnSubmitAdmit" class="btn btn-primary">Submit In-Patient Admission</button>
                    </div>
                </div>
            </div>

            <div id="doctorPickerModal" class="modal-overlay picker-modal-overlay" style="display: none; z-index: 1200;">
                <div class="modal-container" style="max-width: 680px;">
                    <div class="modal-header">
                        <h3 id="doctor_picker_title">Select Attending Physician(s)</h3>
                        <button type="button" class="modal-close" id="btnCloseDoctorPicker" aria-label="Close modal">&times;</button>
                    </div>
                    <div class="modal-body" style="padding: 16px 20px;">
                        <div class="lookup-picker-controls">
                            <input type="text" id="doctor_picker_search" class="form-control lookup-picker-search-input" placeholder="Search physician by name, specialty, or type..." autocomplete="off" style="flex: 1 1 0%; min-width: 100px; font-size: 0.88rem; padding: 8px 12px;">
                            <select id="doctor_picker_filter" class="form-select lookup-picker-select" style="width: auto; flex: 0 0 auto; min-width: 110px; max-width: 145px; font-size: 0.85rem; padding: 8px 10px;">
                                <option value="all">All Doctors</option>
                                <option value="selected">Selected</option>
                                <option value="unselected">Unselected</option>
                                <option value="Resident">Residents</option>
                                <option value="Attending">Attendings</option>
                            </select>
                            <select id="doctor_picker_sort" class="form-select lookup-picker-select" style="width: auto; flex: 0 0 auto; min-width: 115px; max-width: 155px; font-size: 0.85rem; padding: 8px 10px;">
                                <option value="name_asc">Name (A-Z)</option>
                                <option value="name_desc">Name (Z-A)</option>
                                <option value="selected_first">Selected First</option>
                                <option value="fee_asc">Lowest Fee</option>
                                <option value="fee_desc">Highest Fee</option>
                            </select>
                        </div>
                        <div class="table-responsive" style="max-height: 320px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px;">
                            <table class="data-table" id="doctor_picker_table" style="margin: 0; width: 100%;">
                                <thead>
                                    <tr>
                                        <th style="width: 45px; text-align: center;"><input type="checkbox" id="doctor_picker_select_all" style="cursor: pointer;"></th>
                                        <th>Physician Name & Details</th>
                                        <th class="doctor-picker-col-fee">Base Round Fee</th>
                                    </tr>
                                </thead>
                                <tbody id="doctor_picker_tbody"></tbody>
                            </table>
                        </div>
                        <div id="doctor_picker_empty" class="text-muted text-center" style="display: none; padding: 25px 0;">No matching physicians found.</div>
                    </div>
                    <div class="modal-footer" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                        <span id="doctor_picker_status" style="font-size: 0.85rem; color: var(--text-muted);">No physicians selected</span>
                        <div style="display: flex; gap: 8px;">
                            <button type="button" class="btn btn-secondary" id="btnCancelDoctorPicker">Cancel</button>
                            <button type="button" class="btn btn-primary" id="btnConfirmDoctorPicker">Confirm Selection</button>
                        </div>
                    </div>
                </div>
            </div>
                <div class="card">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <h2 style="margin:0;">In-Patient Admissions Log</h2>
                            <button type="button" id="btnRefreshAdmissions" class="btn-refresh" title="Refresh">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="filter-bar">
                            <div class="form-group filter-capsule-search">
                                <label class="form-label" for="search_input">Search Admission ID, Patient, or Bed</label>
                                <input type="text" id="search_input" class="form-control" placeholder="Search admission ID (e.g. ADM-007), patient name, bed code...">
                            </div>

                            <div class="form-group filter-capsule-select">
                                <label class="form-label" for="filter_status">Admission Status</label>
                                <select id="filter_status" class="form-select">
                                    <option value="all" selected>All Records</option>
                                    <option value="Admitted">Admitted (Currently In Hospital)</option>
                                    <option value="Discharged">Discharged</option>
                                    <option value="Billed">Billed Accounts (Settled & With Balance)</option>
                                    <option value="Settled">Settled Only (Paid in Full — ₱0.00 Balance)</option>
                                    <option value="WithBalance">With Balance Only (Promissory Note / Unsettled)</option>
                                </select>
                            </div>
                        </div>

                        <div class="table-responsive" id="table-div">
                        </div>
                    </div>
                </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/sidebar.js?v=19.1"></script>
    <script src="../js/common.js?v=19.1"></script>
    <script src="../js/admissions.js?v=18.3"></script>
</body>
</html>
