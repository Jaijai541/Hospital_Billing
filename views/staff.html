<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Staff & System Users — Hospital Billing System</title>
    <link rel="stylesheet" href="../css/common.css?v=8.2">
    <link rel="stylesheet" href="../css/staff.css?v=8.2">
</head>
<body>

    <div class="app-wrapper">
        <aside id="sidebar-container" class="sidebar"></aside>
        <main class="main-content">
            <div class="topbar">
                <div class="topbar-title">
                    <h1>Staff & System Users</h1>
                    <span class="subtitle">Manage Hospital User Accounts, Access Roles &amp; Assigned Department Stations</span>
                </div>
                <div class="topbar-actions">
                    <button type="button" id="btnOpenAddStaffModal" class="btn btn-primary">+ Add New Staff</button>
                </div>
            </div>

            <div class="content-body">
                <div class="card">
                    <div class="card-header">
                        <h2>Hospital Staff Accounts Directory</h2>
                    </div>
                    <div class="card-body">
                        <div class="filter-bar">
                            <div class="form-group" style="min-width: 280px;">
                                <label class="form-label" for="search_input">Search Staff</label>
                                <input type="text" id="search_input" class="form-control" placeholder="Search by name, username, or station...">
                            </div>

                            <div class="form-group" style="min-width: 180px;">
                                <label class="form-label" for="role_filter">System Role</label>
                                <select id="role_filter" class="form-control">
                                    <option value="all">All Roles</option>
                                </select>
                            </div>

                            <div class="form-group" style="min-width: 160px;">
                                <label class="form-label" for="status_filter">Status</label>
                                <select id="status_filter" class="form-control">
                                    <option value="all">All Accounts</option>
                                    <option value="active" selected>Active Only</option>
                                    <option value="archived">Archived Only</option>
                                </select>
                            </div>

                            <div class="form-group" style="align-self: flex-end;">
                                <button type="button" id="btnRefresh" class="btn btn-secondary">Refresh</button>
                            </div>
                        </div>

                        <div class="table-responsive" id="table-div">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="staffModal" style="display: none;">
        <div class="modal-container" style="max-width: 580px;">
            <div class="modal-header">
                <h3 id="staffModalTitle">Add New Staff User</h3>
                <button type="button" class="modal-close" id="btnCloseStaffModal">&times;</button>
            </div>
            <form id="staffForm">
                <div class="modal-body">
                    <input type="hidden" id="staff_user_id">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                        <div class="form-group">
                            <label class="form-label" for="staff_first_name">First Name *</label>
                            <input type="text" id="staff_first_name" class="form-control" placeholder="e.g. Maria" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="staff_last_name">Last Name *</label>
                            <input type="text" id="staff_last_name" class="form-control" placeholder="e.g. Santos" required>
                        </div>
                    </div>

                    <div class="form-group mt-3">
                        <label class="form-label" for="staff_username">Username *</label>
                        <input type="text" id="staff_username" class="form-control" placeholder="e.g. msantos" required autocomplete="off">
                        <small class="text-muted" style="font-size: 12px;">Unique username used for system sign-in.</small>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;" class="mt-3">
                        <div class="form-group">
                            <label class="form-label" for="staff_role_id">System Role *</label>
                            <select id="staff_role_id" class="form-control" required>
                                <option value="">Select Role...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="staff_station_id">Assigned Station</label>
                            <select id="staff_station_id" class="form-control">
                                <option value="">Unassigned / Admin</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group mt-3" id="password_group">
                        <label class="form-label" for="staff_password" id="staff_password_label">Account Password *</label>
                        <input type="password" id="staff_password" class="form-control" placeholder="Enter password..." autocomplete="new-password">
                        <small class="text-muted" id="staff_password_help" style="font-size: 12px;">Password for account login (min 4 characters).</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="btnArchiveStaff" class="btn btn-warning btn-archive" style="display: none;">Send to Archive</button>
                    <button type="button" id="btnOpenResetFromEdit" class="btn btn-secondary" style="display: none;">Reset Password</button>
                    <button type="button" class="btn btn-secondary" id="btnCancelStaffModal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveStaff">Save Staff Account</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="resetPasswordModal" style="display: none;">
        <div class="modal-container" style="max-width: 480px;">
            <div class="modal-header">
                <h3>Reset Staff Password</h3>
                <button type="button" class="modal-close" id="btnCloseResetModal">&times;</button>
            </div>
            <form id="resetPasswordForm">
                <div class="modal-body">
                    <input type="hidden" id="reset_user_id">
                    <div style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px 16px; margin-bottom: 16px; font-size: 13.5px;">
                        <div><strong style="color: #64748b;">Staff Member:</strong> <span id="reset_staff_name" style="font-weight: 700;"></span></div>
                        <div><strong style="color: #64748b;">Username:</strong> <span id="reset_staff_username" style="font-weight: 700; color: #0284c7;"></span></div>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label" for="reset_new_password">New Password *</label>
                        <input type="password" id="reset_new_password" class="form-control" placeholder="Enter new password (min 4 chars)..." required autocomplete="new-password">
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label" for="reset_confirm_password">Confirm New Password *</label>
                        <input type="password" id="reset_confirm_password" class="form-control" placeholder="Re-enter new password..." required autocomplete="new-password">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="btnCancelResetModal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="btnSaveReset">Update Password</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/sidebar.js?v=8.0"></script>
    <script src="../js/common.js?v=8.2"></script>
    <script src="../js/staff.js?v=8.2"></script>
</body>
</html>
