<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Directory — Hospital Billing System</title>
</head>
<body>

    <p><a href="index.html">Back to Dashboard</a></p>

    <h2>Patient Master Directory</h2>
    <div>
        User: <strong id="user-display">Loading...</strong> | 
        <button id="btn-logout">Logout</button>
    </div>

    <hr>

    <!-- Add / Edit Patient Form -->
    <div>
        <h3 id="form-title">Register New Patient</h3>
        <input type="hidden" id="patient_id" value="">

        <div>
            <label for="first_name">First Name: </label>
            <input type="text" id="first_name" placeholder="First Name" required>

            <label for="last_name">Last Name: </label>
            <input type="text" id="last_name" placeholder="Last Name" required>

            <label for="date_of_birth">Date of Birth: </label>
            <input type="date" id="date_of_birth" required>
        </div>
        <br>
        <div>
            <label for="gender_id">Gender: </label>
            <select id="gender_id" required>
                <option value="">Select Gender...</option>
            </select>

            <label for="blood_type_id">Blood Type: </label>
            <select id="blood_type_id" required>
                <option value="">Select Blood Type...</option>
            </select>

            <label for="contact_number">Contact Number: </label>
            <input type="text" id="contact_number" placeholder="e.g. 0917-123-4567">
        </div>
        <br>
        <div>
            <label for="address">Residential Address: </label>
            <input type="text" id="address" placeholder="Address" size="50">
        </div>
        <br>
        <div>
            <label for="emergency_contact_name">Emergency Contact Name: </label>
            <input type="text" id="emergency_contact_name" placeholder="Emergency Contact Name">

            <label for="emergency_contact_number">Emergency Contact Number: </label>
            <input type="text" id="emergency_contact_number" placeholder="Emergency Contact Number">
        </div>
        <br>
        <div>
            <button id="btnSubmit">Submit Patient</button>
            <button id="btnCancel" style="display:none;">Cancel</button>
        </div>
    </div>

    <hr>

    <h3>Patient Master List</h3>

    <!-- Search, Filter, and Sort Controls (Pure HTML) -->
    <div style="margin-bottom: 12px;">
        <label for="search_input">Search: </label>
        <input type="text" id="search_input" placeholder="Search patient name or code...">

        <label for="filter_status">Status: </label>
        <select id="filter_status">
            <option value="all">All Records</option>
            <option value="1">Active Only</option>
            <option value="0">Soft-Deleted Only</option>
        </select>

        <label for="filter_blood">Blood Type: </label>
        <select id="filter_blood">
            <option value="all">All Blood Types</option>
        </select>

        <label for="sort_by">Sort By: </label>
        <select id="sort_by">
            <option value="code_asc">Code (A to Z)</option>
            <option value="code_desc">Code (Z to A)</option>
            <option value="name_asc">Last Name (A to Z)</option>
            <option value="name_desc">Last Name (Z to A)</option>
            <option value="dob_desc">Youngest First (DOB)</option>
            <option value="dob_asc">Oldest First (DOB)</option>
            <option value="id_desc">Newest First</option>
        </select>
    </div>

    <div id="table-div">
        <!-- Table generated dynamically by JavaScript -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/patients.js"></script>
</body>
</html>
