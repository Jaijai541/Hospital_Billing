<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Billing System - Login</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="brand">
            <h2>🏥 St. Jude Hospital</h2>
            <p>Billing & Patient Information System</p>
        </div>

        <div id="error-message" class="text-danger mb-3" style="font-size: 13px; text-align: center; min-height: 18px; font-weight: 600;"></div>

        <form id="loginForm">
            <div class="form-group mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>

            <div class="form-group mb-4">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" id="btn-login" class="btn btn-primary btn-submit-login">
                Sign In to System
            </button>
        </form>

        <div class="login-credentials-hint">
            <span>Default Test Credentials: <strong>admin</strong> / <strong>admin123</strong></span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
