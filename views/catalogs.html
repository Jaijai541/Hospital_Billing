<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Charge Catalogs — Hospital Billing System</title>
    <link rel="stylesheet" href="../css/common.css?v=20.0">
    <link rel="stylesheet" href="../css/catalogs.css?v=1.1">
</head>
<body>

    <div class="app-wrapper">
        <aside id="sidebar-container" class="sidebar"></aside>
        <main class="main-content">
            <div class="topbar">
                <div class="topbar-title">
                    <h1>Hospital Charge Catalogs</h1>
                    <span class="subtitle">Standardized Billable Medicines, Scans & Medical Services</span>
                </div>
                <button type="button" id="btnOpenAddModal" class="btn btn-primary">+ Add Catalog Item</button>
            </div>
            <div id="formModal" class="modal-overlay">
                <div class="modal-container">
                    <div class="modal-header">
                        <h3 id="form-title">Add New Charge Catalog Item</h3>
                        <button type="button" class="modal-close" id="btnCloseModal" aria-label="Close modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="catalog_id" value="">

                        <div class="form-grid">
                            <div class="form-group span-2">
                                <label class="form-label" for="item_name">Item / Procedure / Medicine Name</label>
                                <input type="text" id="item_name" class="form-control" placeholder="e.g. Paracetamol 500mg, Chest X-Ray" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="category_type">Category Type *</label>
                                <div class="input-lookup-group">
                                    <input type="hidden" id="category_type" required>
                                    <input type="text" id="category_type_text" class="form-control" placeholder="Click to select category..." readonly>
                                    <button type="button" id="btnBrowse_category_type" class="btn btn-outline btn-lookup">Select</button>
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="station_id">Owning Department / Station *</label>
                                <select id="station_id" class="form-select" required>
                                    <option value="1">Central Pharmacy (Medicines &amp; Drugs)</option>
                                    <option value="2">Radiology &amp; Imaging (X-Ray, Ultrasound, CT)</option>
                                    <option value="3">Cardiology Station (ECG, Echo)</option>
                                    <option value="4">Laboratory (CBC, Blood Chemistry)</option>
                                    <option value="5">Nurse Station (Supplies &amp; Ward Care)</option>
                                    <option value="6">Physical Therapy &amp; Rehab</option>
                                    <option value="9">Emergency Department</option>
                                    <option value="11">Intensive Care Unit (ICU)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="code_prefix">Code Prefix</label>
                                <input type="text" id="code_prefix" class="form-control" placeholder="MED" readonly>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="unit_price">Standard Unit Price (₱)</label>
                                <input type="number" step="0.01" min="0" id="unit_price" class="form-control" placeholder="0.00" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" id="btnArchive" class="btn btn-warning btn-archive" style="display: none;">Send to Archive</button>
                        <button type="button" id="btnReset" class="btn btn-secondary">Reset</button>
                        <button type="button" id="btnCancel" class="btn btn-secondary">Cancel</button>
                        <button type="button" id="btnSubmit" class="btn btn-primary">Submit Item</button>
                    </div>
                </div>
            </div>

            <div class="content-body">
                <div class="card">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <h2 style="margin: 0;">Charge Catalogs Directory</h2>
                            <button type="button" id="btnRefreshCatalogs" class="btn-refresh" title="Refresh">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="filter-bar">
                            <div class="form-group filter-capsule-search">
                                <label class="form-label" for="search_input">Search Catalog</label>
                                <input type="text" id="search_input" class="form-control" placeholder="Search item name or code...">
                            </div>

                            <div class="form-group filter-capsule-select">
                                <label class="form-label" for="filter_category">Category</label>
                                <select id="filter_category" class="form-select">
                                    <option value="all">All Categories</option>
                                    <option value="Medicine">Medicines Only</option>
                                    <option value="Equipment Scan">Equipment Scans Only</option>
                                    <option value="Service">Services Only</option>
                                </select>
                            </div>

                            <div class="form-group filter-capsule-select">
                                <label class="form-label" for="filter_station">Department Station</label>
                                <select id="filter_station" class="form-select">
                                    <option value="all">All Departments</option>
                                    <option value="1">Central Pharmacy</option>
                                    <option value="2">Radiology &amp; Imaging</option>
                                    <option value="3">Cardiology Station</option>
                                    <option value="4">Laboratory</option>
                                    <option value="5">Nurse Station</option>
                                    <option value="6">Physical Therapy</option>
                                </select>
                            </div>

                            <div class="form-group filter-capsule-select">
                                <label class="form-label" for="filter_status">Status</label>
                                <select id="filter_status" class="form-select">
                                    <option value="all">All Records</option>
                                    <option value="1">Active Only</option>
                                    <option value="0">Soft-Deleted Only</option>
                                </select>
                            </div>
                        </div>

                        <div class="table-responsive" id="table-div">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/sidebar.js?v=20.0"></script>
    <script src="../js/common.js?v=21.3"></script>
    <script src="../js/catalogs.js?v=18.4"></script>
</body>
</html>
