<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms & Beds Directory — Hospital Billing System</title>
</head>
<body>

    <p><a href="index.html">Back to Dashboard</a></p>

    <h2>Rooms & Beds Directory (Master File)</h2>
    <div>
        User: <strong id="user-display">Loading...</strong> | 
        <button id="btn-logout">Logout</button>
    </div>

    <hr>

    <!-- Add / Edit Room Form -->
    <div>
        <h3 id="form-title">Add New Room</h3>
        <input type="hidden" id="room_id" value="">

        <div>
            <label for="room_name">Room Name: </label>
            <input type="text" id="room_name" placeholder="e.g. Ward A, Private 301" size="25" required>

            <label for="room_type_id">Room Classification: </label>
            <select id="room_type_id" required>
                <option value="">Select Classification...</option>
            </select>

            <label for="daily_rate">Daily Rate (₱): </label>
            <input type="number" step="0.01" id="daily_rate" placeholder="0.00" readonly>

            <label for="capacity">Bed Capacity: </label>
            <input type="number" id="capacity" min="1" max="20" value="1" required>
        </div>
        <br>
        <div>
            <button id="btnSubmit">Submit Room</button>
            <button id="btnCancel" style="display:none;">Cancel</button>
        </div>
    </div>

    <hr>

    <h3>1. Rooms Overview</h3>

    <!-- Search, Filter, and Sort Controls (Pure HTML) -->
    <div style="margin-bottom: 12px;">
        <label for="search_input">Search: </label>
        <input type="text" id="search_input" placeholder="Search room name...">

        <label for="filter_status">Status: </label>
        <select id="filter_status">
            <option value="all">All Records</option>
            <option value="1">Active Only</option>
            <option value="0">Soft-Deleted Only</option>
        </select>

        <label for="filter_room_type">Type: </label>
        <select id="filter_room_type">
            <option value="all">All Room Types</option>
        </select>

        <label for="sort_by">Sort By: </label>
        <select id="sort_by">
            <option value="name_asc">Room Name (A to Z)</option>
            <option value="name_desc">Room Name (Z to A)</option>
            <option value="rate_asc">Daily Rate (Lowest First)</option>
            <option value="rate_desc">Daily Rate (Highest First)</option>
            <option value="capacity_desc">Highest Capacity First</option>
        </select>
    </div>

    <div id="table-div">
        <!-- Room Table generated dynamically by JavaScript -->
    </div>

    <hr>

    <h3>2. Individual Beds List (Room_Bed)</h3>
    <div id="beds-table-div">
        <!-- Beds Table generated dynamically by JavaScript -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/rooms.js"></script>
</body>
</html>
