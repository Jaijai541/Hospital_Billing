<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charge Catalogs — Hospital Billing System</title>
</head>
<body>

    <p><a href="index.html">Back to Dashboard</a></p>

    <h2>Unified Charge Catalogs (Master File)</h2>
    <div>
        User: <strong id="user-display">Loading...</strong> | 
        <button id="btn-logout">Logout</button>
    </div>

    <hr>

    <!-- Add / Edit Catalog Item Form -->
    <div>
        <h3 id="form-title">Add New Charge Catalog Item</h3>
        <input type="hidden" id="item_id" value="">

        <div>
            <label for="catalog_type_id">Category Type: </label>
            <select id="catalog_type_id" required>
                <option value="">Select Category...</option>
            </select>

            <label for="station_id">Department / Station: </label>
            <select id="station_id" required>
                <option value="">Select Department...</option>
            </select>

            <label for="item_name">Item / Procedure Name: </label>
            <input type="text" id="item_name" placeholder="e.g. Paracetamol 500mg, Chest X-Ray" size="35" required>
        </div>
        <br>
        <div>
            <label for="hospital_fee">Hospital / Unit Fee (₱): </label>
            <input type="number" step="0.01" min="0" id="hospital_fee" placeholder="0.00" required>

            <label for="reader_fee" id="label_reader_fee">Doctor Reader's Fee (₱): </label>
            <input type="number" step="0.01" min="0" id="reader_fee" placeholder="0.00" value="0.00">

            <label for="performer_role">Performer Staff Role: </label>
            <input type="text" id="performer_role" placeholder="e.g. Staff Nurse, MedTech" size="25">

            <strong>Total Billing Fee: <span id="total_fee_display">₱ 0.00</span></strong>
        </div>
        <br>
        <div>
            <button id="btnSubmit">Submit Item</button>
            <button id="btnCancel" style="display:none;">Cancel</button>
        </div>
    </div>

    <hr>

    <h3>Charge Catalogs List</h3>

    <!-- Search, Filter, and Sort Controls (Pure HTML) -->
    <div style="margin-bottom: 12px;">
        <label for="search_input">Search: </label>
        <input type="text" id="search_input" placeholder="Search item name or code...">

        <label for="filter_type">Category: </label>
        <select id="filter_type">
            <option value="all">All Categories</option>
        </select>

        <label for="filter_station">Department: </label>
        <select id="filter_station">
            <option value="all">All Departments</option>
        </select>

        <label for="filter_status">Status: </label>
        <select id="filter_status">
            <option value="all">All Records</option>
            <option value="1">Active Only</option>
            <option value="0">Soft-Deleted Only</option>
        </select>

        <label for="sort_by">Sort By: </label>
        <select id="sort_by">
            <option value="code_asc">Code (A to Z)</option>
            <option value="code_desc">Code (Z to A)</option>
            <option value="name_asc">Item Name (A to Z)</option>
            <option value="name_desc">Item Name (Z to A)</option>
            <option value="total_asc">Total Fee (Lowest First)</option>
            <option value="total_desc">Total Fee (Highest First)</option>
            <option value="id_desc">Newest First</option>
        </select>
    </div>

    <div id="table-div">
        <!-- Table generated dynamically by JavaScript -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/catalogs.js"></script>
</body>
</html>
