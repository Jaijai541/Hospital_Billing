<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charge Catalogs — Hospital Billing System</title>
</head>
<body>

    <p><a href="index.html">Back to Dashboard</a></p>

    <h2>Charge Catalogs (Master File)</h2>
    <div>
        User: <strong id="user-display">Loading...</strong> | 
        <button id="btn-logout">Logout</button>
    </div>

    <hr>

    <!-- Add / Edit Catalog Item Form -->
    <div>
        <h3 id="form-title">Add New Charge Catalog Item</h3>
        <input type="hidden" id="catalog_id" value="">

        <div>
            <label for="item_name">Item Name: </label>
            <input type="text" id="item_name" placeholder="e.g. Paracetamol 500mg, Chest X-Ray" size="35" required>

            <label for="category_type">Category Type: </label>
            <select id="category_type" required>
                <option value="">Select Category...</option>
                <option value="Medicine">Medicine (MED)</option>
                <option value="Equipment Scan">Equipment Scan (RAD)</option>
                <option value="Service">Service / Procedure (SRV)</option>
            </select>

            <label for="code_prefix">Code Prefix: </label>
            <input type="text" id="code_prefix" placeholder="MED" size="6" readonly>

            <label for="unit_price">Unit Price (₱): </label>
            <input type="number" step="0.01" min="0" id="unit_price" placeholder="0.00" required>
        </div>
        <br>
        <div>
            <button id="btnSubmit">Submit Item</button>
            <button id="btnCancel" style="display:none;">Cancel</button>
        </div>
    </div>

    <hr>

    <h3>Charge Catalogs List</h3>

    <!-- Search, Filter, and Sort Controls (Pure HTML) -->
    <div style="margin-bottom: 12px;">
        <label for="search_input">Search: </label>
        <input type="text" id="search_input" placeholder="Search item name or code...">

        <label for="filter_category">Category: </label>
        <select id="filter_category">
            <option value="all">All Categories</option>
            <option value="Medicine">Medicines Only</option>
            <option value="Equipment Scan">Equipment Scans Only</option>
            <option value="Service">Services Only</option>
        </select>

        <label for="filter_status">Status: </label>
        <select id="filter_status">
            <option value="all">All Records</option>
            <option value="1">Active Only</option>
            <option value="0">Soft-Deleted Only</option>
        </select>

        <label for="sort_by">Sort By: </label>
        <select id="sort_by">
            <option value="code_asc">Code (A to Z)</option>
            <option value="code_desc">Code (Z to A)</option>
            <option value="name_asc">Item Name (A to Z)</option>
            <option value="name_desc">Item Name (Z to A)</option>
            <option value="price_asc">Price (Lowest First)</option>
            <option value="price_desc">Price (Highest First)</option>
            <option value="id_desc">Newest First</option>
        </select>
    </div>

    <div id="table-div">
        <!-- Table generated dynamically by JavaScript -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/catalogs.js"></script>
</body>
</html>
