<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicines Catalog — Hospital Billing System</title>
</head>
<body>

    <p><a href="index.html">&laquo; Back to Dashboard</a></p>

    <h2>Medicines Catalog (Master File)</h2>
    <div>
        User: <strong id="user-display">Loading...</strong> | 
        <button id="btn-logout">Logout</button>
    </div>

    <hr>

    <!-- Add / Edit Form -->
    <div>
        <h3 id="form-title">Add New Medicine</h3>
        <input type="hidden" id="medicine_id" value="">

        <label for="generic_name">Generic Name: </label>
        <input type="text" id="generic_name" placeholder="e.g. Paracetamol 500mg" required>

        <label for="station_id">Department: </label>
        <select id="station_id" required>
            <option value="">Select Department...</option>
        </select>

        <label for="unit_price">Unit Price (₱): </label>
        <input type="number" step="0.01" min="0" id="unit_price" placeholder="Unit Price" required>

        <button id="btnSubmit">Submit</button>
        <button id="btnCancel" style="display:none;">Cancel</button>
    </div>

    <hr>

    <h3>Medicines List</h3>

    <!-- Search, Filter, and Sort Controls (Pure HTML) -->
    <div style="margin-bottom: 12px;">
        <label for="search_input">Search Name: </label>
        <input type="text" id="search_input" placeholder="Search medicine...">

        &nbsp;&nbsp;
        <label for="filter_status">Filter Status: </label>
        <select id="filter_status">
            <option value="all">All Records</option>
            <option value="1">Active Only</option>
            <option value="0">Soft-Deleted Only</option>
        </select>

        &nbsp;&nbsp;
        <label for="sort_by">Sort By: </label>
        <select id="sort_by">
            <option value="code_asc">Code (A to Z)</option>
            <option value="code_desc">Code (Z to A)</option>
            <option value="name_asc">Name (A to Z)</option>
            <option value="name_desc">Name (Z to A)</option>
            <option value="price_asc">Price (Lowest First)</option>
            <option value="price_desc">Price (Highest First)</option>
            <option value="id_desc">Newest First (ID)</option>
        </select>
    </div>

    <div id="table-div">
        <!-- Dynamic Table created by JavaScript -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/medicines.js"></script>
</body>
</html>
